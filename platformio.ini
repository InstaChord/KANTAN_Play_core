; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html


[platformio]
; default_envs = native_x86
; default_envs = native_m1mac
; default_envs = esp32s3_arduino
; default_envs = esp32_arduino
; default_envs = esp32_idf
default_envs = release_s3
src_dir = main
lib_dir = components

[env]
lib_deps =
    bblanchon/ArduinoJson @ ^7.3.0
    ; M5GFX 0.2.25 で fonts::lv_font_montserrat_48 が利用不可になるため、
    ; 動作確認済みのバージョンに固定する
    M5Stack/M5Unified @ 0.2.14
    https://github.com/m5stack/M5GFX/archive/refs/tags/0.2.20.zip

[env:native_x86]
platform = native
build_type = debug
build_flags = -O0 -xc++ -std=c++17 -lSDL2
  -lkantan-music
  -L"./main/kantan-music/x86"
  -I"/usr/local/include/SDL2"                ; for intel mac homebrew SDL2
  -L"/usr/local/lib"                         ; for intel mac homebrew SDL2
  -DM5GFX_SCALE=2
  -DM5GFX_ROTATION=1
  -DM5GFX_BOARD=board_M5StackCore2
  -DM5GFX_SHOW_FRAME
  -DM5GFX_SHORTCUT_MOD=KMOD_LALT

[env:native_linux]
platform = native
build_type = debug
build_flags = -O0 -xc++ -std=c++17 -lSDL2
  -lkantan-music
  -L"./main/kantan-music/linux_x86"
  -DM5GFX_SCALE=2
  -DM5GFX_ROTATION=1
  -DM5GFX_BOARD=board_M5StackCore2
  -DM5GFX_SHOW_FRAME
  -DM5GFX_SHORTCUT_MOD=KMOD_LALT

[env:native_m1mac]
platform = native
build_type = debug
build_flags = -O0 -xc++ -std=c++17 -lSDL2
  -lkantan-music
  -L"./main/kantan-music/m1mac"
;  -fgnu89-inline
  -arch arm64                                ; for arm mac
  -I"${sysenv.HOMEBREW_PREFIX}/include" ; for arm mac homebrew SDL2
  -I"${sysenv.HOMEBREW_PREFIX}/include/SDL2" ; for arm mac homebrew SDL2
  -L"${sysenv.HOMEBREW_PREFIX}/lib"          ; for arm mac homebrew SDL2
  -DM5GFX_SCALE=2
  -DM5GFX_ROTATION=1
  -DM5GFX_BOARD=board_M5StackCore2
  -DM5GFX_SHOW_FRAME

[esp32_base]
build_type = debug
; platform = espressif32
; platform = espressif32@6.9.0
; platform = espressif32@6.11.0

; platform = https://github.com/pioarduino/platform-espressif32/releases/download/51.03.07/platform-espressif32.zip

; platform = https://github.com/pioarduino/platform-espressif32/releases/download/53.03.10/platform-espressif32.zip

; platform = https://github.com/pioarduino/platform-espressif32/releases/download/53.03.11/platform-espressif32.zip

; I2S の初期化で user context not in internal RAM エラーが出る
; platform = https://github.com/pioarduino/platform-espressif32/releases/download/53.03.13-1/platform-espressif32.zip

; USB-HUB動作NG
; platform = https://github.com/pioarduino/platform-espressif32/releases/download/53.03.13/platform-espressif32.zip

; USB-HUB動作OK
; platform = https://github.com/pioarduino/platform-espressif32/releases/download/54.03.20/platform-espressif32.zip

; USB-HUB動作OK
platform = https://github.com/pioarduino/platform-espressif32/releases/download/54.03.21-2/platform-espressif32.zip

; platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.30-2/platform-espressif32.zip

board = m5stack-core2
board_build.f_cpu = 80000000L
board_build.f_flash = 80000000L
board_build.flash_mode = qio
board_build.partitions = default_16MB.csv
; board_build.partitions = app3M_fat9M_16MB.csv
upload_speed = 1500000
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
build_unflags = 
; -D ARDUINO_USB_MODE
build_flags =
    -lkantan-music
    -L"${PROJECT_DIR}/main/kantan-music/esp32"
    -DBOARD_HAS_PSRAM=1
    -DUSE_UTF8_LONG_NAMES=1
    ; ブラウザUIの配信元 (通常時 / developer mode 時)。github.io アカウント名で切替
    -DKANPLAY_UI_BASE=\"https://instachord.github.io/KANTAN_Play_core/ui\"
    -DKANPLAY_UI_BASE_DEV=\"https://u1nagata.github.io/KANTAN_Play_core/ui\"
    ; -DKANPLAY_USE_VFS_LITTLEFS=1  ; LittleFSでVFSを強制使用 (既定)
    ; -DKANPLAY_USE_VFS_SD=1        ; SDでVFSを強制使用 (要: SPIバスが競合しない環境)
    ; -DENABLE_USB_HUBS=1
    ; -DCONFIG_USB_HOST_HUBS_SUPPORTED=1
    ; -DCONFIG_USB_HOST_HUB_MULTI_LEVEL=1
    ; -DARDUINO_USB_MODE=0
    ; -DCORE_DEBUG_LEVEL=5
    ; -DARDUINO_USB_CDC_ON_BOOT=1
    ; -DUSE_TINYUSB=true
lib_deps = ${env.lib_deps}
    SdFat

[usb_host_compat]
build_flags =
    ; CoreS3のUSBホスト互換処理は、かんぷれとSamplerで共通利用する。
    ; 古いUSB 1.1機器と構成記述子の大きい複合USB MIDI機器に対応。
    -L"${PROJECT_DIR}/components/usb_host_compat"
    -Wl,--wrap=hcd_port_handle_event
    -Wl,--wrap=hcd_port_command
    -Wl,--wrap=enum_process
    -Wl,--wrap=usbh_dev_submit_ctrl_urb
    -Wl,--wrap=hcd_urb_dequeue
  
[env:esp32_arduino]
extends = esp32_base
framework = arduino
build_unflags = ${esp32_base.build_unflags}
build_flags = ${esp32_base.build_flags}
    -DCORE_DEBUG_LEVEL=5
    -Wall -Wextra -Wreturn-local-addr -Werror=format -Werror=return-local-addr

[env:esp32s3_arduino]
extends = esp32_base
framework = arduino
board = m5stack-cores3
; board = esp32-s3-devkitc-1
build_unflags = ${esp32_base.build_unflags}
build_flags = ${esp32_base.build_flags}
    ${usb_host_compat.build_flags}
    -DCORE_DEBUG_LEVEL=5
    -Wall -Wextra -Wreturn-local-addr -Werror=format -Werror=return-local-addr

[env:esp32_idf]
extends = esp32_base
framework = espidf

[env:release]
extends = env:esp32_arduino
build_type = release
build_unflags = ${esp32_base.build_unflags}
build_flags = ${esp32_base.build_flags}
    -DCORE_DEBUG_LEVEL=0
    -O2

extra_scripts = post:generate_user_custom.py

[env:release_s3]
extends = env:esp32s3_arduino
build_type = release
build_unflags = ${esp32_base.build_unflags}
build_flags = ${esp32_base.build_flags}
    ${usb_host_compat.build_flags}
    -DCORE_DEBUG_LEVEL=0
    -O2

extra_scripts = post:generate_user_custom.py

; KANTAN Sequencer CoreS3 verification build.
; Keep this release-equivalent target free of post-build publication side
; effects so local/CI checks never rewrite tracked OTA or USB installer files.
[env:sequencer_check_s3]
extends = env:esp32s3_arduino
build_type = release
build_unflags = ${esp32_base.build_unflags}
build_flags = ${esp32_base.build_flags}
    ${usb_host_compat.build_flags}
    -DCORE_DEBUG_LEVEL=0
    -O2

; ==========================================================================
; KANTAN Sampler — 同一ハードウェア向けの別ファームウェア
; -DKANPLAY_SAMPLER=1 によりエントリポイントがサンプラー側に切り替わる
; （main/main.cpp が無効化され main/sampler/ 配下が有効になる）
; ==========================================================================

; CoreS3 サンプラー リリースビルド
[env:sampler_s3]
extends = env:esp32s3_arduino
build_type = release
build_unflags = ${esp32_base.build_unflags}
build_flags = ${esp32_base.build_flags}
    ${usb_host_compat.build_flags}
    -DCORE_DEBUG_LEVEL=0
    -O2
    -DKANPLAY_SAMPLER=1
    -DKANPLAY_RELEASE_SYNTH_SAM_PCM=1
    -DKANPLAY_SAMPLER_UI_BASE=\"https://u1nagata.github.io/KANTAN_Play_core/sampler-ui\"
    -Wl,--wrap=esp_mbedtls_mem_calloc

extra_scripts = pre:sampler_embedded_assets.py
    post:generate_user_custom.py

; Release-equivalent Sampler regression build without publication side effects.
; Keep the asset dependency hook, but do not rewrite tracked OTA/USB artifacts.
[env:sampler_check_s3]
extends = env:esp32s3_arduino
build_type = release
build_unflags = ${esp32_base.build_unflags}
build_flags = ${esp32_base.build_flags}
    ${usb_host_compat.build_flags}
    -DCORE_DEBUG_LEVEL=0
    -O2
    -DKANPLAY_SAMPLER=1
    -DKANPLAY_RELEASE_SYNTH_SAM_PCM=1
    -DKANPLAY_SAMPLER_UI_BASE=\"https://u1nagata.github.io/KANTAN_Play_core/sampler-ui\"
    -Wl,--wrap=esp_mbedtls_mem_calloc
extra_scripts = pre:sampler_embedded_assets.py

; CoreS3 サンプラー デバッグビルド
[env:sampler_s3_debug]
extends = env:esp32s3_arduino
build_unflags = ${esp32_base.build_unflags}
build_flags = ${esp32_base.build_flags}
    ${usb_host_compat.build_flags}
    -DCORE_DEBUG_LEVEL=5
    -Wall -Wextra -Wreturn-local-addr -Werror=format -Werror=return-local-addr
    -DKANPLAY_SAMPLER=1
    -DKANPLAY_SAMPLER_LATENCY_PROBE=1
    -DKANPLAY_RELEASE_SYNTH_SAM_PCM=1
    -DKANPLAY_SAMPLER_UI_BASE=\"https://u1nagata.github.io/KANTAN_Play_core/sampler-ui\"

; Release-equivalent timing build. It keeps -O2 and the production audio
; layout, adding only aggregate latency counters and deferred serial reports.
[env:sampler_s3_latency_probe]
extends = env:sampler_s3
build_flags = ${env:sampler_s3.build_flags}
    -DKANPLAY_SAMPLER_LATENCY_PROBE=1

; A/B control: same probe and event scheduling, original PCM mixer.
[env:sampler_s3_latency_reference]
extends = env:sampler_s3_latency_probe
build_flags = ${env:sampler_s3_latency_probe.build_flags}
    -DKANPLAY_SAMPLER_PCM_REFERENCE=1

; AMY feasibility probe. This environment is deliberately separate from the
; release firmware: it links the pinned upstream AMY version and prints
; startup/render/memory measurements without taking over I2S.
[env:sampler_s3_amy_probe]
extends = env:esp32s3_arduino
build_type = release
build_unflags = ${esp32_base.build_unflags}
lib_deps = ${env.lib_deps}
    SdFat
    https://github.com/shorepine/amy.git#223723765c84e6f0148c0a5f6a01674d9e828dd4
build_flags = ${esp32_base.build_flags}
    ${usb_host_compat.build_flags}
    -DCORE_DEBUG_LEVEL=0
    -O2
    -DKANPLAY_SAMPLER=1
    -DKANPLAY_SAMPLER_UI_BASE=\"https://u1nagata.github.io/KANTAN_Play_core/sampler-ui\"
    -DKANPLAY_AMY_PROBE=1
    -DAMY_HOST_MIDI=1
    -Wl,--wrap=esp_mbedtls_mem_calloc
extra_scripts = pre:amy_probe_build.py

; Audible AMY integration prototype. Melody, Chord, and Bass GM messages are
; rendered by AMY on Core 0 and mixed into the existing 48 kHz Parts bus.
; The normal sampler_s3 release environment remains unchanged.
[env:sampler_s3_amy_integration]
extends = env:esp32s3_arduino
build_type = release
custom_sdkconfig =
    CONFIG_BT_ALLOCATION_FROM_SPIRAM_FIRST=y
build_unflags = ${esp32_base.build_unflags}
lib_deps = ${env.lib_deps}
    SdFat
    https://github.com/shorepine/amy.git#223723765c84e6f0148c0a5f6a01674d9e828dd4
build_flags = ${esp32_base.build_flags}
    ${usb_host_compat.build_flags}
    -DCORE_DEBUG_LEVEL=0
    -O2
    -DKANPLAY_SAMPLER=1
    -DKANPLAY_SAMPLER_UI_BASE=\"https://u1nagata.github.io/KANTAN_Play_core/sampler-ui\"
    -DKANPLAY_AMY_INTEGRATION=1
    -DAMY_HOST_MIDI=1
    ; The custom Bluetooth SDK config rebuild omits Arduino TinyUSB's Kconfig
    ; symbols. Keep the existing USB MIDI device API available in this build.
    -DCONFIG_TINYUSB_ENABLED=1
    -DCONFIG_TINYUSB_CDC_ENABLED=1
    -DCONFIG_TINYUSB_CDC_MAX_PORTS=2
    -DCONFIG_TINYUSB_CDC_RX_BUFSIZE=64
    -DCONFIG_TINYUSB_CDC_TX_BUFSIZE=64
    -DCONFIG_TINYUSB_MSC_ENABLED=1
    -DCONFIG_TINYUSB_MSC_BUFSIZE=4096
    -DCONFIG_TINYUSB_HID_ENABLED=1
    -DCONFIG_TINYUSB_HID_BUFSIZE=64
    -DCONFIG_TINYUSB_MIDI_ENABLED=1
    -DCONFIG_TINYUSB_MIDI_RX_BUFSIZE=64
    -DCONFIG_TINYUSB_MIDI_TX_BUFSIZE=64
    -DCONFIG_TINYUSB_VIDEO_ENABLED=1
    -DCONFIG_TINYUSB_VIDEO_STREAMING_BUFSIZE=64
    -DCONFIG_TINYUSB_VIDEO_STREAMING_IFS=1
    -DCONFIG_TINYUSB_DFU_RT_ENABLED=1
    -DCONFIG_TINYUSB_DFU_ENABLED=1
    -DCONFIG_TINYUSB_DFU_BUFSIZE=4096
    -DCONFIG_TINYUSB_VENDOR_ENABLED=1
    -DCONFIG_TINYUSB_VENDOR_RX_BUFSIZE=64
    -DCONFIG_TINYUSB_VENDOR_TX_BUFSIZE=64
    -DCONFIG_TINYUSB_NCM_ENABLED=1
    -DKANPLAY_CUSTOM_ARDUINO_SDK=1
    -includeWString.h
    -Wl,--wrap=esp_mbedtls_mem_calloc
extra_scripts = pre:amy_probe_build.py

; Apple Silicon Mac 上でのサンプラー ネイティブビルド (SDL2 シミュレータ)
[env:sampler_native_m1mac]
extends = env:native_m1mac
build_flags = ${env:native_m1mac.build_flags}
    -DKANPLAY_SAMPLER=1
